name: Bug report
description: Report a reproducible HYPERPIX problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Import...
        3. Click...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: input
    id: gpu
    attributes:
      label: GPU
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
