name: Feature request
description: Propose a HYPERPIX feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop UI
        - AI engine
        - Image analysis
        - Upscaling
        - Face restoration
        - HyperDepth / HyperBokeh
        - Export
        - Infrastructure
