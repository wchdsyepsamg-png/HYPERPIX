[project]
name = "hyperpix-api"
version = "0.1.0"
description = "HYPERPIX AI image enhancement API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=11.3,<12",
  "numpy>=2.3,<3",
  "opencv-python-headless>=4.12,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
